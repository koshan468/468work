<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工時監控 V72 - 最終穩定版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --nogizaka-purple: #742174;
            --soft-purple: #F3E5F5;
            --weekly-volt: rgb(206, 255, 0);
            --danger-red: #FF0000;
            --gold-wealth: #D4AF37;
            --silver-medal: #C0C0C0;
            --soft-beige: #FDF5E6;
            --soft-pink: #FCE4EC;
            --warning-orange: #FF9800;
            --other-month-bg: #FFF3E0; 
            --other-month-text: #E65100;
        }
        body { font-family: "Segoe UI", sans-serif; background: #FFFFFF; margin: 0; padding-top: 85px; overflow-x: hidden; }
        
        .header-nav { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; 
            background: #FFF; border-bottom: 2px solid #EEE;
            padding: 0 10px; display: flex; align-items: center; 
            justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            height: 75px;
        }

        .nav-left { display: flex; gap: 4px; flex: 1.2; align-items: center; }
        .nav-center { display: flex; align-items: baseline; justify-content: center; flex: 4.5; gap: 10px; }
        .rate-group { display: flex; align-items: baseline; gap: 4px; }
        .label-text { font-size: 13px; font-weight: bold; color: #333; white-space: nowrap; }
        .rate-num { font-size: 14px; font-weight: 900; color: var(--nogizaka-purple); }
        .gold-val { color: var(--gold-wealth); font-size: 20px; font-weight: 900; }
        
        .nav-right { display: flex; gap: 4px; flex: 3; justify-content: flex-end; align-items: center; }
        select { padding: 4px; border-radius: 6px; border: 1px solid #CCC; font-weight: bold; font-size: 13px; color: var(--nogizaka-purple); background: white; }
        
        .btn { padding: 6px 6px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
        .btn-stats { background: var(--soft-pink); color: #C2185B; border: 1px solid #F8BBD0; }
        .btn-raise { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
        .btn-img { background: var(--soft-beige); color: #8B4513; border: 1px solid #F5DEB3; }
        .btn-reset { background: #F5F5F5; color: #666; border: 1px solid #DDD; }

        #capture-area { padding: 5px; background: white; }
        .week-container { margin-bottom: 15px; border-bottom: 4px solid #F5F5F5; }
        .grid { display: grid; grid-template-columns: 60px repeat(7, 1fr) 85px 85px; gap: 4px; }
        
        .label-cell { border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; min-height: 60px; text-align: center; }
        .bg-purple { background: var(--soft-purple); color: var(--nogizaka-purple); }
        .bg-blue { background: #E3F2FD; color: #0277BD; }
        .bg-orange-soft { background: var(--other-month-bg) !important; color: var(--other-month-text) !important; }

        .date-val { font-size: 22px; font-weight: 900; }
        .sun-red { color: var(--danger-red) !important; }
        
        .input-cell { background: #FFF; border: 1px dashed #DDD; border-radius: 6px; min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; cursor: pointer; }
        
        .is-new-wing { background: var(--gold-wealth) !important; border: 1px solid #B8860B !important; color: #FFF !important; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .is-old-wing { background: var(--silver-medal) !important; border: 1px solid #A9A9A9 !important; color: #333 !important; }

        .circle-container { width: 75px; height: 75px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .this-week-circle { background: var(--weekly-volt); color: #000; font-weight: bold; }
        .accum-circle { background: #B39DDB; color: white; }
        .circle-num { font-weight: 900; font-size: 24px; }
        .text-red { color: #FF0000 !important; }
        .bg-warning { background: var(--warning-orange) !important; }
        .bg-danger { background: var(--danger-red) !important; animation: blinker 0.6s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 15px; width: 95%; max-width: 800px; border-radius: 12px; position: relative; box-sizing: border-box; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #999; }

        .wing-selector { display: flex; gap: 20px; justify-content: center; padding: 20px 0; }
        .axe-option { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .axe-option:active { transform: scale(0.9); }
        .axe-icon { font-size: 60px; line-height: 1; margin-bottom: 5px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
        .axe-label { font-size: 14px; font-weight: 900; color: #444; }
        .wing-tag { font-size: 18px; font-weight: 900; color: var(--nogizaka-purple); margin-top: 5px; }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="nav-left">
        <select id="yearSelect" onchange="manualNavigate()"></select>
        <select id="monthSelect" onchange="manualNavigate()"></select>
    </div>
    <div class="nav-center">
        <div class="rate-group">
            <span class="label-text">時薪:</span>
            <span class="rate-num" id="currentRateDisp">$70</span>
        </div>
        <div class="rate-group">
            <span style="font-size: 20px;">💰</span>
            <span class="gold-val">$<span id="totalPay">0</span></span>
        </div>
    </div>
    <div class="nav-right">
        <button class="btn btn-stats" onclick="showStats()">📊 統計</button>
        <button class="btn btn-raise" onclick="manageSalary()">📅 加薪</button>
        <button class="btn btn-img" onclick="takeScreenshot()">📸 存圖</button>
        <button class="btn btn-reset" onclick="confirmReset()">💀 重置</button>
    </div>
</div>

<div id="capture-area"><div id="app-content"></div></div>

<div id="wingModal" class="modal">
    <div class="modal-content" style="max-width: 320px; text-align: center; border: 3px solid var(--nogizaka-purple);">
        <h3 style="margin-top:0; color: var(--nogizaka-purple);">你的斧頭掉進哪個場地？</h3>
        <div class="wing-selector">
            <div class="axe-option" onclick="chooseWing('N')">
                <div class="axe-icon">🪓</div>
                <div class="axe-label" style="color: #B8860B;">金色的斧頭</div>
                <div class="wing-tag">N</div>
            </div>
            <div class="axe-option" onclick="chooseWing('O')">
                <div class="axe-icon" style="filter: grayscale(1) brightness(1.2) drop-shadow(0 4px 4px rgba(0,0,0,0.2));">🪓</div>
                <div class="axe-label" style="color: #777;">銀色的斧頭</div>
                <div class="wing-tag">O</div>
            </div>
        </div>
    </div>
</div>

<div id="statsModal" class="modal">
    <div class="modal-content" id="stats-area">
        <span class="close-btn" onclick="document.getElementById('statsModal').style.display='none'">&times;</span>
        <h2 id="statsTitle" style="text-align:center; color: var(--nogizaka-purple); margin-top: 5px; font-size: 18px;"></h2>
        <div style="position: relative; height: 320px; margin-bottom: 10px;"><canvas id="salaryChart"></canvas></div>
        <div style="text-align:center;"><button class="btn btn-img" style="margin: 0 auto; padding: 10px 40px;" onclick="saveStatsJPG()">📸 存圖</button></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('WorkData_V60')) || {};
    let raises = JSON.parse(localStorage.getItem('SalaryRaises_V50')) || [{date: '2025-12-28', rate: 70}];
    const zodiacs = ['🐭','🐮','🐯','🐰','🐲','🐍','🐴','🐑','🐒','🐔','🐶','🐷'];
    let currentEditingKey = null;

    function setup() {
        const yS = document.getElementById('yearSelect');
        const mS = document.getElementById('monthSelect');
        yS.innerHTML = '';
        for (let y = 2026; y <= 2035; y++) yS.add(new Option(y + "年", y));
        for (let m = 1; m <= 12; m++) mS.add(new Option(m + "月", m));
        yS.value = 2026; mS.value = new Date().getMonth() + 1;
        initView();
    }

    function getRateAtDate(dateStr) {
        const sorted = [...raises].sort((a, b) => new Date(b.date) - new Date(a.date));
        const target = new Date(dateStr);
        for (let r of sorted) { if (target >= new Date(r.date)) return r.rate; }
        return raises[0].rate;
    }

    function edit(k) { currentEditingKey = k; document.getElementById('wingModal').style.display = 'block'; }

    function chooseWing(wing) {
        document.getElementById('wingModal').style.display = 'none';
        const oldData = db[currentEditingKey] || { val: 0 };
        const rawV = prompt(`你的斧頭掉了多長時間?`, oldData.val || "");
        if (rawV === null) return;
        
        const v = parseFloat(rawV);
        const decimalPart = v % 1;
        const isValidDecimal = (decimalPart === 0 || decimalPart === 0.25 || decimalPart === 0.5 || decimalPart === 0.75);
        
        if (isNaN(v) || v < 3 || !isValidDecimal) {
            alert("錯誤，請誠實回答!");
            return;
        }

        if (v === 0) delete db[currentEditingKey];
        else db[currentEditingKey] = { val: v, wing: wing };
        localStorage.setItem('WorkData_V60', JSON.stringify(db));
        initView();
    }

    function renderWeek(wStart) {
        const currentSelMonth = parseInt(document.getElementById('monthSelect').value) - 1;
        const section = document.createElement('div');
        section.className = 'week-container';
        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.innerHTML = `<div class="label-cell bg-purple" style="font-size:14px">時段</div>`;
        
        for(let i=0; i<7; i++){
            let d = new Date(wStart); d.setDate(d.getDate()+i);
            const isDiff = d.getMonth() !== currentSelMonth;
            grid.innerHTML += `<div class="label-cell ${isDiff ? 'bg-orange-soft' : 'bg-blue'}"><div><span style="font-size:10px; font-weight:900;">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span><br><span class="date-val ${i===0?'sun-red':''}">${d.getDate()}</span></div></div>`;
        }
        grid.innerHTML += `<div class="label-cell" style="background:#E8F5E9; color:#2E7D32; font-size:14px;">本週</div><div class="label-cell bg-purple" style="font-size:14px;">累計</div>`;

        ['AM','PM'].forEach(t => {
            grid.innerHTML += `<div class="label-cell bg-purple" style="font-size:14px">${t}</div>`;
            for(let i=0; i<7; i++){
                let d = new Date(wStart); d.setDate(d.getDate()+i);
                const k = `${t}-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
                const isDiff = d.getMonth() !== currentSelMonth;
                const data = db[k];
                let extraClass = data ? (data.wing === 'N' ? 'is-new-wing' : 'is-old-wing') : (isDiff ? 'bg-orange-soft' : '');
                grid.innerHTML += `<div class="input-cell ${extraClass}" onclick="edit('${k}')">${data ? data.val : ''}</div>`;
            }
        });

        let wT = 0, roll = 0;
        for(let i=0; i<7; i++) {
            let d = new Date(wStart); d.setDate(d.getDate()+i);
            wT += (db[`AM-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`]?.val||0) + (db[`PM-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`]?.val||0);
        }
        for(let j=0; j<28; j++) {
            let rd = new Date(wStart); rd.setDate(rd.getDate()+6-j);
            roll += (db[`AM-${rd.getFullYear()}-${rd.getMonth()+1}-${rd.getDate()}`]?.val||0) + (db[`PM-${rd.getFullYear()}-${rd.getMonth()+1}-${rd.getDate()}`]?.val||0);
        }
        let accumClass = 'accum-circle';
        if (roll >= 68) accumClass += ' bg-danger';
        else if (roll >= 63) accumClass += ' bg-warning';

        grid.innerHTML += `
            <div style="grid-area: 2/9/4/10" class="circle-container this-week-circle"><span style="font-size:10px">WEEKLY</span><span class="circle-num ${wT>=17?'text-red':''}">${wT}</span></div>
            <div style="grid-area: 2/10/4/11" class="circle-container ${accumClass}"><span style="font-size:10px">4-WEEK</span><span class="circle-num">${roll}</span></div>`;
        section.appendChild(grid);
        document.getElementById('app-content').appendChild(section);
    }

    function initView() {
        document.getElementById('app-content').innerHTML = '';
        const selYear = document.getElementById('yearSelect').value;
        const selMonth = document.getElementById('monthSelect').value;
        let firstDayOfMonth = new Date(selYear, selMonth - 1, 1);
        let lastDayOfMonth = new Date(selYear, selMonth, 0);
        let start = new Date(firstDayOfMonth);
        start.setDate(firstDayOfMonth.getDate() - firstDayOfMonth.getDay());
        const totalDaysNeeded = firstDayOfMonth.getDay() + lastDayOfMonth.getDate();
        const rowsNeeded = Math.ceil(totalDaysNeeded / 7);
        for(let i=0; i < rowsNeeded; i++) { renderWeek(new Date(start)); start.setDate(start.getDate() + 7); }
        calcSalary();
    }

    function calcSalary() {
        const y = document.getElementById('yearSelect').value;
        const m = document.getElementById('monthSelect').value;
        let total = 0;
        for(let k in db) {
            const p = k.split('-');
            if (p[1] == y && p[2] == m) total += db[k].val * getRateAtDate(`${p[1]}-${p[2].padStart(2,'0')}-${p[3].padStart(2,'0')}`);
        }
        document.getElementById('totalPay').innerText = total.toLocaleString();
        updateRateDisplay(y, m);
    }

    function updateRateDisplay(y, m) {
        const disp = document.getElementById('currentRateDisp');
        const mStr = String(m).padStart(2,'0');
        const firstDayStr = `${y}-${mStr}-01`;
        const initialRate = getRateAtDate(firstDayStr);
        const monthlyRaise = raises.find(r => {
            const rDate = new Date(r.date);
            return rDate.getFullYear() == y && (rDate.getMonth() + 1) == m && rDate.getDate() > 1;
        });
        if (monthlyRaise) {
            const rDay = new Date(monthlyRaise.date).getDate();
            disp.innerText = `$${initialRate} | ${rDay}日起: $${monthlyRaise.rate}`;
        } else {
            disp.innerText = `$${initialRate}`;
        }
    }

    function showStats() {
        const year = document.getElementById('yearSelect').value;
        const monthlyTotals = new Array(12).fill(0);
        for(let k in db) {
            const p = k.split('-');
            if (p[1] === year) monthlyTotals[parseInt(p[2])-1] += db[k].val * getRateAtDate(`${p[1]}-${p[2].padStart(2,'0')}-${p[3].padStart(2,'0')}`);
        }
        document.getElementById('statsTitle').innerText = `${year} 年度薪金統計`;
        document.getElementById('statsModal').style.display = 'block';
        const ctx = document.getElementById('salaryChart').getContext('2d');
        if (window.chartInstance) window.chartInstance.destroy();
        window.chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
                datasets: [{ label: '月薪金 $', data: monthlyTotals, backgroundColor: 'rgba(116, 33, 116, 0.6)', borderColor: '#742174', borderWidth: 1 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { ticks: { callback: function(val, index) { return [this.getLabelForValue(index), zodiacs[index]]; }, font: { size: 14 } } },
                    y: { beginAtZero: true }
                },
                plugins: { legend: { display: false } },
                animation: {
                    onComplete: function() {
                        const chart = this; const ctx = chart.ctx;
                        ctx.font = "bold 12px Arial"; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#742174';
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((bar, idx) => { if(dataset.data[idx] > 0) ctx.fillText('$' + dataset.data[idx].toLocaleString(), bar.x, bar.y - 5); });
                        });
                    }
                }
            }
        });
    }

    function manualNavigate() { initView(); window.scrollTo(0,0); }
    function manageSalary() {
        const d = prompt("加薪日期 (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
        if (!d) return;
        const r = prompt("新時薪:");
        if (r) { 
            raises.push({date: d, rate: parseFloat(r)}); 
            raises.sort((a,b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('SalaryRaises_V50', JSON.stringify(raises)); 
            calcSalary(); 
        }
    }
    async function takeScreenshot() {
        const canvas = await html2canvas(document.getElementById('capture-area'), { scale: 2 });
        const link = document.createElement('a');
        link.download = `WorkReport.jpg`; link.href = canvas.toDataURL("image/jpeg", 0.9); link.click();
    }
    async function saveStatsJPG() {
        const area = document.getElementById('stats-area');
        area.querySelector('.close-btn').style.opacity = '0';
        area.querySelector('button').style.opacity = '0';
        const canvas = await html2canvas(area, { scale: 2 });
        const link = document.createElement('a');
        link.download = `Stats.jpg`; link.href = canvas.toDataURL("image/jpeg", 0.9); link.click();
        area.querySelector('.close-btn').style.opacity = '1';
        area.querySelector('button').style.opacity = '1';
    }
    function confirmReset() { if(confirm("💀 確定重置數據？")) { localStorage.clear(); location.reload(); } }
    setup();
</script>
</body>
</html>
